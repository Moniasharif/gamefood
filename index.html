<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Food Quiz — Team Battle 🍽️</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Card ───────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.35);
      width: 100%;
      max-width: 540px;
      overflow: hidden;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.88) translateY(20px); }
      to   { opacity:1; transform:scale(1)   translateY(0); }
    }

    /* ── Scoreboard header ──────────────────── */
    .scoreboard {
      display: flex;
      align-items: stretch;
      border-bottom: 3px solid #f0f2f5;
    }
    .team-score {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 10px 12px;
      gap: 3px;
      transition: background .3s;
    }
    .team-score.t1 { background: #e3f2fd; border-right: 2px solid #f0f2f5; }
    .team-score.t2 { background: #fff3e0; }
    .team-score.active-t1 { background: #1565c0; }
    .team-score.active-t2 { background: #e65100; }
    .team-score.active-t1 .team-label,
    .team-score.active-t1 .team-pts  { color:#fff !important; }
    .team-score.active-t2 .team-label,
    .team-score.active-t2 .team-pts  { color:#fff !important; }

    .team-label {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #888;
    }
    .team-pts {
      font-size: 1.9rem;
      font-weight: 900;
      color: #222;
      line-height: 1;
    }
    .team-icon { font-size: 1.2rem; }

    .score-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      gap: 2px;
    }
    .score-mid .vs  { font-size:.7rem; font-weight:800; color:#aaa; letter-spacing:1px; }
    .score-mid .qnum{ font-size:.78rem; font-weight:700; color:#555; white-space:nowrap; }

    /* ── Ready screen ───────────────────────── */
    #ready-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 32px 40px;
      gap: 18px;
      animation: fadeIn .35s ease;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .ready-team-badge {
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 50px;
      color: #fff;
    }
    .ready-team-badge.t1 { background: #1565c0; }
    .ready-team-badge.t2 { background: #e65100; }

    .ready-icon { font-size: 4.5rem; line-height: 1; }

    .ready-title {
      font-size: 1.55rem;
      font-weight: 900;
      color: #222;
      text-align: center;
      line-height: 1.3;
    }
    .ready-title span { display: block; font-size: 1rem; font-weight: 600; color: #888; margin-top: 4px; }

    .ready-scores-row {
      display: flex;
      gap: 20px;
      background: #f8f9fa;
      border-radius: 14px;
      padding: 14px 28px;
    }
    .ready-score-item { text-align: center; }
    .ready-score-item .rsi-label { font-size:.72rem; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:.5px; }
    .ready-score-item .rsi-val   { font-size:1.5rem; font-weight:900; color:#222; }
    .ready-score-item.t1 .rsi-val { color:#1565c0; }
    .ready-score-item.t2 .rsi-val { color:#e65100; }
    .ready-divider { width:1px; background:#e0e0e0; }

    .start-btn {
      width: 100%;
      max-width: 280px;
      border: none;
      border-radius: 50px;
      padding: 17px 0;
      font-size: 1.08rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      letter-spacing: .5px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
    }
    .start-btn.t1 { background: linear-gradient(135deg,#1976d2,#1565c0); }
    .start-btn.t2 { background: linear-gradient(135deg,#f4511e,#e65100); }
    .start-btn:hover  { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.25); }
    .start-btn:active { transform:scale(.97); }

    /* ── Quiz section ───────────────────────── */
    #quiz-section { display:none; padding: 22px 26px 28px; animation: fadeIn .3s ease; }

    /* Team turn banner */
    .turn-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 10px;
      padding: 8px 16px;
      margin-bottom: 16px;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .4px;
    }
    .turn-banner.t1 { background: #e3f2fd; color: #1565c0; }
    .turn-banner.t2 { background: #fff3e0; color: #e65100; }

    /* Timer */
    .timer-wrapper { margin-bottom: 16px; }
    .timer-label {
      font-size:.8rem; font-weight:700; margin-bottom:6px;
      display:flex; align-items:center; gap:5px;
    }
    .timer-label.t1 { color:#1565c0; }
    .timer-label.t2 { color:#e65100; }

    .timer-bar-bg { background:#e9ecef; border-radius:50px; height:10px; overflow:hidden; }
    .timer-bar {
      height:100%; border-radius:50px; width:100%;
      transition: width 1s linear;
    }
    .timer-bar.t1 { background: linear-gradient(90deg,#1565c0,#42a5f5); }
    .timer-bar.t2 { background: linear-gradient(90deg,#e65100,#ff9800); }

    /* Image */
    .dish-img-wrapper {
      width:100%; aspect-ratio:16/9;
      border-radius:14px; overflow:hidden;
      background:#f5f5f5; margin-bottom:10px;
      display:flex; align-items:center; justify-content:center;
    }
    .dish-img-wrapper img {
      width:100%; height:100%; object-fit:cover; display:block;
    }
    .dish-emoji-placeholder { font-size:5rem; line-height:1; user-select:none; }

    .dish-name {
      text-align:center; font-size:1.12rem; font-weight:800;
      color:#222; margin:6px 0 4px;
    }
    .question {
      text-align:center; font-size:.88rem; font-weight:600;
      color:#777; margin-bottom:18px;
    }

    /* Options */
    .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    .option-btn {
      background:#f8f9fa; border:2px solid #e9ecef;
      border-radius:12px; padding:13px 10px;
      font-size:.87rem; font-weight:600; color:#333;
      cursor:pointer; transition:background .18s,border-color .18s,transform .12s;
      line-height:1.3; text-align:center;
    }
    .option-btn:hover:not(:disabled)  { background:#e8f5e9; border-color:#66bb6a; transform:translateY(-2px); }
    .option-btn.t1:hover:not(:disabled){ background:#e3f2fd; border-color:#90caf9; }
    .option-btn.t2:hover:not(:disabled){ background:#fff3e0; border-color:#ffb74d; }
    .option-btn:active:not(:disabled) { transform:scale(.97); }
    .option-btn.correct { background:#e8f5e9!important; border-color:#43a047!important; color:#1b5e20!important; }
    .option-btn.wrong   { background:#ffebee!important; border-color:#e53935!important; color:#b71c1c!important; }
    .option-btn:disabled { cursor:default; }

    /* Timesup */
    .timesup-banner {
      display:none; text-align:center;
      background:#fff8e1; border:1.5px solid #ffcc02;
      border-radius:10px; padding:8px 14px;
      font-size:.9rem; font-weight:700; color:#f57f17;
      margin-top:14px; animation:shake .4s ease;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
    }

    /* ── Result screen ──────────────────────── */
    #result-screen {
      display:none; padding:36px 28px 40px;
      text-align:center; animation:fadeIn .5s ease;
    }
    .result-emoji { font-size:3rem; margin-bottom:8px; }
    #result-screen h2 { font-size:1.6rem; color:#222; margin-bottom:22px; }

    .result-teams {
      display:flex; gap:16px; justify-content:center; margin-bottom:20px;
    }
    .result-team-card {
      flex:1; max-width:180px;
      border-radius:18px; padding:20px 14px;
      transition:transform .3s;
    }
    .result-team-card.t1 { background:#e3f2fd; border:2px solid #90caf9; }
    .result-team-card.t2 { background:#fff3e0; border:2px solid #ffb74d; }
    .result-team-card.winner {
      transform:scale(1.06);
      box-shadow:0 8px 28px rgba(0,0,0,.18);
    }
    .result-team-card.winner.t1 { background:#1565c0; border-color:#1565c0; }
    .result-team-card.winner.t2 { background:#e65100; border-color:#e65100; }
    .rtc-icon  { font-size:2rem; margin-bottom:4px; }
    .rtc-label { font-size:.75rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#888; }
    .result-team-card.winner .rtc-label { color:rgba(255,255,255,.8); }
    .rtc-score { font-size:3rem; font-weight:900; color:#222; line-height:1; }
    .result-team-card.t1 .rtc-score { color:#1565c0; }
    .result-team-card.t2 .rtc-score { color:#e65100; }
    .result-team-card.winner .rtc-score { color:#fff; }
    .rtc-out-of { font-size:.75rem; color:#aaa; }
    .result-team-card.winner .rtc-out-of { color:rgba(255,255,255,.7); }
    .rtc-crown  { font-size:1.6rem; }

    .result-verdict {
      font-size:1.1rem; font-weight:700; color:#444;
      margin-bottom:26px; padding:12px 20px;
      background:#f8f9fa; border-radius:12px;
    }
    .play-again-btn {
      background:linear-gradient(135deg,#1565c0,#e65100);
      color:#fff; border:none; border-radius:50px;
      padding:15px 44px; font-size:1.05rem; font-weight:800;
      cursor:pointer; transition:transform .15s,box-shadow .15s;
      box-shadow:0 4px 16px rgba(0,0,0,.25);
    }
    .play-again-btn:hover  { transform:translateY(-3px); box-shadow:0 8px 28px rgba(0,0,0,.3); }
    .play-again-btn:active { transform:scale(.97); }

    @media(max-width:420px){
      #quiz-section { padding:16px 14px 22px; }
      #ready-section{ padding:28px 18px 32px; }
      .options-grid { gap:8px; }
      .option-btn   { font-size:.8rem; padding:11px 6px; }
      .result-teams { gap:10px; }
    }
  </style>
</head>
<body>
<div class="card" id="card">

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="team-score t1" id="t1-header">
      <div class="team-icon">🔵</div>
      <div class="team-label">Team 1</div>
      <div class="team-pts" id="t1-pts">0</div>
    </div>
    <div class="score-mid">
      <div class="vs">VS</div>
      <div class="qnum" id="qnum-mid">Q 0 / 20</div>
    </div>
    <div class="team-score t2" id="t2-header">
      <div class="team-icon">🔴</div>
      <div class="team-label">Team 2</div>
      <div class="team-pts" id="t2-pts">0</div>
    </div>
  </div>

  <!-- Ready Screen -->
  <div id="ready-section">
    <div class="ready-team-badge t1" id="ready-badge">TEAM 1</div>
    <div class="ready-icon" id="ready-icon">🔵</div>
    <div class="ready-title" id="ready-title">
      Team 1 — Are you ready?
      <span>Pass the device to Team 1 and press Start!</span>
    </div>
    <div class="ready-scores-row">
      <div class="ready-score-item t1">
        <div class="rsi-label">🔵 Team 1</div>
        <div class="rsi-val" id="ready-t1-score">0</div>
      </div>
      <div class="ready-divider"></div>
      <div class="ready-score-item t2">
        <div class="rsi-label">🔴 Team 2</div>
        <div class="rsi-val" id="ready-t2-score">0</div>
      </div>
    </div>
    <button class="start-btn t1" id="start-btn" onclick="startQuestion()">
      🚀 Start!
    </button>
  </div>

  <!-- Quiz Section -->
  <div id="quiz-section">
    <div class="turn-banner t1" id="turn-banner">🔵 Team 1's Turn</div>

    <div class="timer-wrapper">
      <div class="timer-label t1" id="timer-label-el">
        <span>⏱️</span><span id="time-label">Time left: 10s</span>
      </div>
      <div class="timer-bar-bg">
        <div class="timer-bar t1" id="timer-bar"></div>
      </div>
    </div>

    <div class="dish-img-wrapper" id="dish-img-wrapper">
      <span class="dish-emoji-placeholder">🍽️</span>
    </div>

    <p class="dish-name"  id="dish-name">—</p>
    <p class="question">Which country does this dish come from?</p>
    <div class="options-grid" id="options-grid"></div>
    <div class="timesup-banner" id="timesup-banner">⏰ Time&apos;s up!</div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen">
    <div class="result-emoji">🏆</div>
    <h2>Game Over! 🎉</h2>
    <div class="result-teams">
      <div class="result-team-card t1" id="rtc-t1">
        <div class="rtc-icon">🔵</div>
        <div class="rtc-label">Team 1</div>
        <div class="rtc-score" id="rtc-t1-score">0</div>
        <div class="rtc-out-of">out of 10</div>
        <div class="rtc-crown" id="rtc-t1-crown"></div>
      </div>
      <div class="result-team-card t2" id="rtc-t2">
        <div class="rtc-icon">🔴</div>
        <div class="rtc-label">Team 2</div>
        <div class="rtc-score" id="rtc-t2-score">0</div>
        <div class="rtc-out-of">out of 10</div>
        <div class="rtc-crown" id="rtc-t2-crown"></div>
      </div>
    </div>
    <div class="result-verdict" id="result-verdict">—</div>
    <button class="play-again-btn" onclick="location.reload()">Play Again 🔄</button>
  </div>

</div><!-- /card -->
<script>
/* ═══════ DATA ═══════════════════════════════════════════════ */
const dishesData = [
  { name:"Fish and Chips",        emoji:"🐟",  image:"images/fish_chips.jpg",   correct:"United Kingdom 🇬🇧", options:["United Kingdom 🇬🇧","USA 🇺🇸","Australia 🇦🇺","Canada 🇨🇦"] },
  { name:"Pizza Margherita",      emoji:"🍕",  image:"images/pizza.jpg",         correct:"Italy 🇮🇹",           options:["France 🇫🇷","Italy 🇮🇹","Spain 🇪🇸","Greece 🇬🇷"] },
  { name:"Tacos",                 emoji:"🌮",  image:"images/tacos.jpg",         correct:"Mexico 🇲🇽",          options:["Brazil 🇧🇷","Mexico 🇲🇽","Argentina 🇦🇷","Colombia 🇨🇴"] },
  { name:"Sushi",                 emoji:"🍣",  image:"images/sushi.jpg",         correct:"Japan 🇯🇵",           options:["China 🇨🇳","South Korea 🇰🇷","Japan 🇯🇵","Thailand 🇹🇭"] },
  { name:"Croissant",             emoji:"🥐",  image:"images/croissant.jpg",     correct:"France 🇫🇷",          options:["Switzerland 🇨🇭","Belgium 🇧🇪","France 🇫🇷","Italy 🇮🇹"] },
  { name:"Cheeseburger",          emoji:"🍔",  image:"images/burger.jpg",        correct:"USA 🇺🇸",             options:["Germany 🇩🇪","USA 🇺🇸","United Kingdom 🇬🇧","Canada 🇨🇦"] },
  { name:"Ramen",                 emoji:"🍜",  image:"images/ramen.jpg",         correct:"Japan 🇯🇵",           options:["Japan 🇯🇵","China 🇨🇳","Vietnam 🇻🇳","South Korea 🇰🇷"] },
  { name:"Paella",                emoji:"🥘",  image:"images/paella.jpg",        correct:"Spain 🇪🇸",           options:["Portugal 🇵🇹","Italy 🇮🇹","Spain 🇪🇸","Mexico 🇲🇽"] },
  { name:"Pad Thai",              emoji:"🍝",  image:"images/pad_thai.jpg",      correct:"Thailand 🇹🇭",        options:["Indonesia 🇮🇩","Thailand 🇹🇭","Malaysia 🇲🇾","Philippines 🇵🇭"] },
  { name:"Greek Salad",           emoji:"🥗",  image:"images/greek_salad.jpg",   correct:"Greece 🇬🇷",          options:["Turkey 🇹🇷","Italy 🇮🇹","Greece 🇬🇷","Cyprus 🇨🇾"] },
  { name:"Chicken Tikka Masala",  emoji:"🍛",  image:"images/tikka.jpg",         correct:"India 🇮🇳",           options:["Pakistan 🇵🇰","India 🇮🇳","Bangladesh 🇧🇩","Sri Lanka 🇱🇰"] },
  { name:"Guacamole",             emoji:"🥑",  image:"images/guacamole.jpg",     correct:"Mexico 🇲🇽",          options:["Mexico 🇲🇽","Peru 🇵🇪","Chile 🇨🇱","Spain 🇪🇸"] },
  { name:"Cheese Fondue",         emoji:"🧀",  image:"images/fondue.jpg",        correct:"Switzerland 🇨🇭",     options:["Austria 🇦🇹","France 🇫🇷","Switzerland 🇨🇭","Germany 🇩🇪"] },
  { name:"Falafel",               emoji:"🧆",  image:"images/falafel.jpg",       correct:"Egypt 🇪🇬",           options:["Egypt 🇪🇬","Lebanon 🇱🇧","Turkey 🇹🇷","Greece 🇬🇷"] },
  { name:"Peking Duck",           emoji:"🦆",  image:"images/peking_duck.jpg",   correct:"China 🇨🇳",           options:["Japan 🇯🇵","China 🇨🇳","South Korea 🇰🇷","Singapore 🇸🇬"] },
  { name:"Mac and Cheese",        emoji:"🍝",  image:"images/mac_cheese.jpg",    correct:"USA 🇺🇸",             options:["Canada 🇨🇦","United Kingdom 🇬🇧","USA 🇺🇸","Australia 🇦🇺"] },
  { name:"French Onion Soup",     emoji:"🍲",  image:"images/french_onion.jpg",  correct:"France 🇫🇷",          options:["Italy 🇮🇹","France 🇫🇷","Belgium 🇧🇪","Switzerland 🇨🇭"] },
  { name:"Kimchi",                emoji:"🥬",  image:"images/kimchi.jpg",        correct:"South Korea 🇰🇷",     options:["China 🇨🇳","Japan 🇯🇵","South Korea 🇰🇷","Vietnam 🇻🇳"] },
  { name:"Mansaf",                emoji:"🍖",  image:"images/mansaf.jpg",        correct:"Jordan 🇯🇴",          options:["Saudi Arabia 🇸🇦","Jordan 🇯🇴","Iraq 🇮🇶","Syria 🇸🇾"] },
  { name:"Koshary",               emoji:"🍚",  image:"images/koshary.jpg",       correct:"Egypt 🇪🇬",           options:["Egypt 🇪🇬","Sudan 🇸🇩","Morocco 🇲🇦","Tunisia 🇹🇳"] }
];

/* ═══════ STATE ══════════════════════════════════════════════ */
const TOTAL      = dishesData.length;   // 20
const TIME_PER_Q = 10;

let questions    = [];
let currentIndex = 0;           // 0–19
let t1Score      = 0;
let t2Score      = 0;
let timerInterval= null;
let timeLeft     = TIME_PER_Q;
let answered     = false;

// Team 1 plays odd questions (index 0,2,4…), Team 2 plays even (1,3,5…)
function currentTeam() { return (currentIndex % 2 === 0) ? 1 : 2; }

/* ═══════ DOM ════════════════════════════════════════════════ */
const readySection   = document.getElementById("ready-section");
const quizSection    = document.getElementById("quiz-section");
const resultScreen   = document.getElementById("result-screen");

const readyBadge     = document.getElementById("ready-badge");
const readyIcon      = document.getElementById("ready-icon");
const readyTitle     = document.getElementById("ready-title");
const startBtn       = document.getElementById("start-btn");
const readyT1Score   = document.getElementById("ready-t1-score");
const readyT2Score   = document.getElementById("ready-t2-score");

const t1Header       = document.getElementById("t1-header");
const t2Header       = document.getElementById("t2-header");
const t1Pts          = document.getElementById("t1-pts");
const t2Pts          = document.getElementById("t2-pts");
const qnumMid        = document.getElementById("qnum-mid");

const turnBanner     = document.getElementById("turn-banner");
const timerLabelEl   = document.getElementById("timer-label-el");
const timeLabel      = document.getElementById("time-label");
const timerBar       = document.getElementById("timer-bar");
const dishImgWrapper = document.getElementById("dish-img-wrapper");
const dishNameEl     = document.getElementById("dish-name");
const optionsGrid    = document.getElementById("options-grid");
const timesupBanner  = document.getElementById("timesup-banner");

/* ═══════ HELPERS ════════════════════════════════════════════ */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function applyTeamColor(team) {
  // Scoreboard active highlight
  t1Header.className = "team-score t1" + (team===1 ? " active-t1" : "");
  t2Header.className = "team-score t2" + (team===2 ? " active-t2" : "");

  // Quiz turn banner
  if (team===1) {
    turnBanner.className    = "turn-banner t1";
    turnBanner.textContent  = "🔵  Team 1's Turn";
    timerLabelEl.className  = "timer-label t1";
    timerBar.className      = "timer-bar t1";
  } else {
    turnBanner.className    = "turn-banner t2";
    turnBanner.textContent  = "🔴  Team 2's Turn";
    timerLabelEl.className  = "timer-label t2";
    timerBar.className      = "timer-bar t2";
  }

  // Option buttons hover colour applied via class
  document.querySelectorAll(".option-btn").forEach(function(b){
    b.classList.remove("t1","t2");
    b.classList.add(team===1?"t1":"t2");
  });
}

/* ═══════ INIT ═══════════════════════════════════════════════ */
function init() {
  questions    = shuffle(dishesData);
  currentIndex = 0;
  t1Score      = 0;
  t2Score      = 0;
  showReadyScreen();
}

/* ═══════ READY SCREEN ═══════════════════════════════════════ */
function showReadyScreen() {
  var team = currentTeam();
  quizSection.style.display   = "none";
  resultScreen.style.display  = "none";
  readySection.style.display  = "flex";

  // update scores display
  t1Pts.textContent        = t1Score;
  t2Pts.textContent        = t2Score;
  readyT1Score.textContent = t1Score;
  readyT2Score.textContent = t2Score;
  qnumMid.textContent      = "Q " + currentIndex + " / " + TOTAL;

  // reset scoreboard highlight (neutral while waiting)
  t1Header.className = "team-score t1";
  t2Header.className = "team-score t2";

  if (team === 1) {
    readyBadge.className        = "ready-team-badge t1";
    readyBadge.textContent      = "TEAM 1";
    readyIcon.textContent       = "🔵";
    readyTitle.innerHTML        = "Team 1 — Are you ready?<span>Pass the device to Team 1 and press Start!</span>";
    startBtn.className          = "start-btn t1";
  } else {
    readyBadge.className        = "ready-team-badge t2";
    readyBadge.textContent      = "TEAM 2";
    readyIcon.textContent       = "🔴";
    readyTitle.innerHTML        = "Team 2 — Are you ready?<span>Pass the device to Team 2 and press Start!</span>";
    startBtn.className          = "start-btn t2";
  }
  startBtn.textContent = "🚀  Start — Question " + (currentIndex+1) + "!";
}

/* ═══════ START QUESTION ═════════════════════════════════════ */
function startQuestion() {
  var team = currentTeam();
  readySection.style.display = "none";
  quizSection.style.display  = "block";

  answered = false;
  timesupBanner.style.display = "none";

  var q = questions[currentIndex];

  // Update scoreboard
  t1Pts.textContent   = t1Score;
  t2Pts.textContent   = t2Score;
  qnumMid.textContent = "Q " + (currentIndex+1) + " / " + TOTAL;

  applyTeamColor(team);

  // Dish name
  dishNameEl.textContent = q.name;

  // Image
  dishImgWrapper.innerHTML = "<span class='dish-emoji-placeholder'>"+q.emoji+"</span>";
  var img = new Image();
  img.alt = q.name;
  img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;border-radius:14px;";
  img.onerror = function(){};
  img.onload  = function(){ dishImgWrapper.innerHTML=""; dishImgWrapper.appendChild(img); };
  img.src = q.image;

  // Options
  var opts = shuffle(q.options);
  optionsGrid.innerHTML = "";
  opts.forEach(function(opt){
    var btn = document.createElement("button");
    btn.className   = "option-btn " + (team===1?"t1":"t2");
    btn.textContent = opt;
    btn.addEventListener("click", function(){ handleAnswer(btn, opt, q.correct); });
    optionsGrid.appendChild(btn);
  });

  startTimer();
}

/* ═══════ TIMER ══════════════════════════════════════════════ */
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIME_PER_Q;
  timerBar.style.transition = "none";
  timerBar.style.width = "100%";
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      timerBar.style.transition = "width "+TIME_PER_Q+"s linear";
      timerBar.style.width = "0%";
    });
  });
  updateTimerLabel();
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimerLabel();
    if (timeLeft <= 0) { clearInterval(timerInterval); onTimeUp(); }
  }, 1000);
}

function updateTimerLabel() {
  timeLabel.textContent = "Time left: " + timeLeft + "s";
}

function stopTimer() {
  clearInterval(timerInterval);
  var pct = (timeLeft / TIME_PER_Q) * 100;
  timerBar.style.transition = "none";
  timerBar.style.width = pct + "%";
}

/* ═══════ ANSWER HANDLING ════════════════════════════════════ */
function handleAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  stopTimer();
  disableAllButtons();

  if (chosen === correct) {
    btn.classList.add("correct");
    if (currentTeam()===1) t1Score++; else t2Score++;
    t1Pts.textContent = t1Score;
    t2Pts.textContent = t2Score;
  } else {
    btn.classList.add("wrong");
    highlightCorrect(correct);
  }
  scheduleNext();
}

function onTimeUp() {
  if (answered) return;
  answered = true;
  disableAllButtons();
  highlightCorrect(questions[currentIndex].correct);
  timesupBanner.style.display = "block";
  scheduleNext();
}

function highlightCorrect(correct) {
  document.querySelectorAll(".option-btn").forEach(function(b){
    if (b.textContent === correct) b.classList.add("correct");
  });
}
function disableAllButtons() {
  document.querySelectorAll(".option-btn").forEach(function(b){ b.disabled=true; });
}

/* ═══════ NEXT ═══════════════════════════════════════════════ */
function scheduleNext() {
  setTimeout(function(){
    currentIndex++;
    if (currentIndex < TOTAL) {
      showReadyScreen();
    } else {
      showResult();
    }
  }, 1800);
}

/* ═══════ RESULT ═════════════════════════════════════════════ */
function showResult() {
  readySection.style.display  = "none";
  quizSection.style.display   = "none";
  resultScreen.style.display  = "block";

  t1Header.className = "team-score t1";
  t2Header.className = "team-score t2";
  qnumMid.textContent = "Q 20 / 20";

  var rtcT1 = document.getElementById("rtc-t1");
  var rtcT2 = document.getElementById("rtc-t2");
  document.getElementById("rtc-t1-score").textContent = t1Score;
  document.getElementById("rtc-t2-score").textContent = t2Score;
  document.getElementById("rtc-t1-crown").textContent = "";
  document.getElementById("rtc-t2-crown").textContent = "";

  var verdict = "";
  if (t1Score > t2Score) {
    rtcT1.classList.add("winner");
    rtcT2.classList.remove("winner");
    document.getElementById("rtc-t1-crown").textContent = "👑";
    verdict = "🔵 Team 1 wins! Congratulations! 🎉";
  } else if (t2Score > t1Score) {
    rtcT2.classList.add("winner");
    rtcT1.classList.remove("winner");
    document.getElementById("rtc-t2-crown").textContent = "👑";
    verdict = "🔴 Team 2 wins! Congratulations! 🎉";
  } else {
    rtcT1.classList.remove("winner");
    rtcT2.classList.remove("winner");
    verdict = "🤝 It&apos;s a tie! Both teams are food experts!";
  }
  document.getElementById("result-verdict").innerHTML = verdict;
}

/* ═══════ START ══════════════════════════════════════════════ */
init();
</script>
